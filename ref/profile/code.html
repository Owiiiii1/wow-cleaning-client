<script>
        // Micro-interaction: Ripple effect simulation for primary buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                const x = e.clientX - e.target.offsetLeft;
                const y = e.clientY - e.target.offsetTop;
                
                let ripple = document.createElement('span');
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                ripple.classList.add('absolute', 'w-0', 'h-0', 'bg-primary-container/20', 'rounded-full', 'pointer-events-none', 'transition-all', 'duration-500', 'ease-out', 'opacity-50');
                
                this.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.style.width = '200%';
                    ripple.style.height = '200%';
                    ripple.style.marginLeft = '-100%';
                    ripple.style.marginTop = '-100%';
                    ripple.style.opacity = '0';
                }, 10);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
    </script>
