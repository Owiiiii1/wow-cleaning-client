<script>
        // Simple interaction to simulate transition after splash
        document.body.addEventListener('click', () => {
            document.body.style.transition = 'opacity 0.5s ease-out';
            document.body.style.opacity = '0';
            setTimeout(() => {
                // In a real app, this would route to the main dashboard
                console.log('Transitioning to Home...');
                document.body.style.opacity = '1';
            }, 500);
        });

        // Add floating animation to the logo
        const logo = document.querySelector('.relative.mb-lg');
        let floatY = 0;
        let direction = 1;
        
        function animateLogo() {
            floatY += 0.05 * direction;
            if (Math.abs(floatY) > 5) direction *= -1;
            logo.style.transform = `translateY(${floatY}px)`;
            requestAnimationFrame(animateLogo);
        }
        
        requestAnimationFrame(animateLogo);
    </script>
