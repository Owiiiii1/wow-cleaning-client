<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
    :root {
      --primary-blue: #37b7ff;
      --mustard: #ffe169;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
    }
    .sparkle {
      position: absolute;
      background: var(--mustard);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: sparkle-anim 2s infinite ease-in-out;
      z-index: 10;
    }
    @keyframes sparkle-anim {
      0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
      50% { transform: scale(1.2) rotate(45deg); opacity: 1; }
    }
    .floating-mascot {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }
    .success-badge-pulse {
      animation: badge-pulse 3s infinite;
    }
    @keyframes badge-pulse {
      0% { box-shadow: 0 0 0 0 rgba(55, 183, 255, 0.4); }
      70% { box-shadow: 0 0 0 20px rgba(55, 183, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(55, 183, 255, 0); }
    }
    .background-pattern {
      background-image: radial-gradient(#37b7ff 0.5px, transparent 0.5px), radial-gradient(#37b7ff 0.5px, #fbf9f8 0.5px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      opacity: 0.05;
    }
  </style>

        extend: {

                  "on-secondary": "#ffffff",
                  "error": "#ba1a1a",
                  "on-background": "#1b1c1c",

                  "surface-container-low": "#f5f3f3",
                  "on-primary-container": "#004567",

                  "on-tertiary": "#ffffff",
                  "outline-variant": "#bec8d2",
                  "secondary-container": "#fede58",
                  "inverse-on-surface": "#f2f0f0",
                  "error-container": "#ffdad6",
                  "surface-container-lowest": "#ffffff",

                  "surface-variant": "#e4e2e2",

                  "on-secondary-fixed-variant": "#544600",
                  "on-error": "#ffffff",
                  "surface-tint": "#006492",
                  "on-error-container": "#93000a",
                  "primary-fixed": "#c9e6ff",

                  "surface-container-high": "#eae8e7",
                  "secondary-fixed-dim": "#e3c541",
                  "primary-fixed-dim": "#8bceff",
                  "surface-container": "#efeded",
                  "on-primary-fixed": "#001e2f",
                  "surface-dim": "#dbd9d9",
                  "surface": "#fbf9f8",
                  "on-primary-fixed-variant": "#004b6f",
                  "primary": "#006492",
                  "tertiary-container": "#acadad",
                  "on-secondary-fixed": "#221b00",
                  "secondary": "#6f5d00",
                  "surface-container-highest": "#e4e2e2",

          "borderRadius": {

          "spacing": {

                  "base": "8px",
                  "gutter": "16px",
                  "container-margin": "20px",
                  "lg": "24px",
                  "xl": "32px",
                  "md": "16px",
                  "sm": "12px"
          },
          "fontFamily": {

          "fontSize": {

<body class="bg-background text-on-background min-h-screen flex flex-col items-center">

</div>
<!-- Action Section -->

<button class="w-full py-4 bg-transparent border-2 border-outline-variant text-on-surface-variant font-section-title text-section-title rounded-xl hover:bg-surface-variant transition-colors active:scale-95">
        BACK TO HOME
      </button>
</section>
<!-- Celebration Micro-copy -->
<div class="mt-lg flex items-center justify-center gap-xs text-primary">
<span class="material-symbols-outlined text-[16px]">auto_awesome</span>
<span class="font-label-sm text-label-sm uppercase tracking-widest">Sparkle Guaranteed</span>
</div>
</main>
<!-- Interactive Sparkle Generator Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.body;
      
      const createSparkle = (x, y) => {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        const size = Math.random() * 10 + 5;
        sparkle.style.width = `${size}px`;
        sparkle.style.height = `${size}px`;
        sparkle.style.left = `${x}px`;
        sparkle.style.top = `${y}px`;
        sparkle.style.animation = 'sparkle-anim 1s forwards';
        container.appendChild(sparkle);
        
        setTimeout(() => sparkle.remove(), 1000);
      };

      // Periodic random sparkles
      setInterval(() => {
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;
        createSparkle(x, y);
      }, 3000);

      // Button interaction
      const primaryBtn = document.querySelector('button');
      primaryBtn.addEventListener('click', (e) => {
        for(let i=0; i<8; i++) {
          setTimeout(() => {
            const rect = primaryBtn.getBoundingClientRect();
            const x = rect.left + Math.random() * rect.width;
            const y = rect.top + Math.random() * rect.height;
            createSparkle(x, y);
          }, i * 50);
        }
      });
    });
  </script>
